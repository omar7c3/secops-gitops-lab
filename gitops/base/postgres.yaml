# =============================================================================
# Demo Secret — db-secret
# Used in Scenario 2 to demonstrate secretRef pattern
#
# The secret itself is fine — it is referenced via secretRef (correct).
# The misconfiguration is that it is mounted as an env var, making it
# readable via printenv inside the container.
#
# NOTE: In a real environment never store secrets in Git.
# This is a demo-only fake secret with no real credentials.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: secops-lab
  labels:
    app.kubernetes.io/managed-by: argocd
    secops-lab/secret-type: demo-fake
type: Opaque
stringData:
  # Fake credentials — demo only
  password: "demo-db-password-fake-123"
  username: "app"

---
# =============================================================================
# Postgres — Demo Database
# Gives the attack script something realistic to connect to
# Only accessible from target-app via NetworkPolicy
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: secops-lab
  labels:
    app: postgres
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: minimal-sa
      automountServiceAccountToken: false

      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "appdb"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          ports:
            - containerPort: 5432

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999   # postgres user
            readOnlyRootFilesystem: false  # postgres needs write access
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          emptyDir: {}   # Demo only — data is not persisted across restarts

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: secops-lab
  labels:
    app: postgres
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
